<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:min(450px, calc(100% - 32px));
            margin:clamp(24px, 8vh, 90px) auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        .form-group input{
            width:100%;
            min-height:42px;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        .form-group input:focus{
            outline:none;
            border-color:#007bff;
        }

        .forgot-password{
            text-align:right;
            margin-top:-10px;
            margin-bottom:20px;
        }

        .forgot-password a{
            text-decoration:none;
            color:#007bff;
            font-size:14px;
        }

        .forgot-password a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .signup-link{
            text-align:center;
            margin-top:20px;
        }

        .signup-link a{
            color:#007bff;
            text-decoration:none;
            font-weight:bold;
        }

        .signup-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:520px){
            .container{padding:22px}
        }

        #holdBtn{
    width:100%;
    height:50px;
    border:none;
    border-radius:8px;
    background:linear-gradient(to right,#007bff 0%,#ffffff 0%);
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    overflow:hidden;
    transition:transform .2s;
}

#holdBtn.holding{

    transform:scale(1.03);

}

#holdBtn.success{

    background:#28a745 !important;
    color:white;

}

#message{

    text-align:center;

    margin-top:15px;

    color:red;

    font-weight:bold;

}

    </style>

    <script src="language.js" defer></script>
</head>

<body>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <div class="form-group">
            <label>Email</label>
            <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required>
        </div>

        <div class="form-group">

    <label>Password</label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required>

</div>

        <div class="forgot-password">
            <a href="forgotpassword.html">Forgot Password?</a>
        </div>

<button type="button" id="holdBtn">
    Press & Hold to Start Journey
</button>

<p id="message"></p>

    </form>

    <div class="signup-link">
        Don't have an account?
        <a href="login.html">Create Account</a>
    </div>

</div>

<script src="api.js"></script>
<script>

const holdBtn = document.getElementById("holdBtn");
const message = document.getElementById("message");

let progress = 0;
let timer;
let authenticating = false;

/* Hold Button Animation */

document.getElementById("loginForm").addEventListener("submit", event => event.preventDefault());
holdBtn.addEventListener("mousedown", startHold);
holdBtn.addEventListener("touchstart", startHold, { passive: true });
holdBtn.addEventListener("mouseup", stopHold);
holdBtn.addEventListener("mouseleave", stopHold);
holdBtn.addEventListener("touchend", stopHold);

async function startHold(){
    if(authenticating) return;
    authenticating = true;
    holdBtn.disabled = true;
    message.textContent = "";
    try {
        const result = await EasyBook.request("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email: document.getElementById("email").value.trim(), password: document.getElementById("password").value })
        });
        EasyBook.saveSession(result);
        holdBtn.disabled = false;
        progress = 0;
        holdBtn.classList.add("holding");
        timer = setInterval(function(){
            progress += 5;
            holdBtn.style.background = `linear-gradient(to right,#007bff ${progress}%,#ffffff ${progress}%)`;
            if(progress === 20) holdBtn.textContent = "Checking Credentials...";
            if(progress === 40) holdBtn.textContent = "Preparing Journey...";
            if(progress === 60) holdBtn.textContent = "Boarding...";
            if(progress === 80) holdBtn.textContent = "Starting Engine...";
            if(progress >= 100){
                clearInterval(timer);
                holdBtn.classList.remove("holding");
                holdBtn.classList.add("success");
                holdBtn.textContent = "Journey Started";
                const next = new URLSearchParams(location.search).get("next");
                const safeNext = next && /^\/?[a-z]+\.html(?:\?.*)?$/i.test(next) ? next : "home.html";
                setTimeout(function(){ location.href = safeNext; }, 500);
            }
        }, 25);
    } catch(error) {
        message.style.color = "red";
        message.textContent = error.message;
        holdBtn.disabled = false;
    } finally {
        authenticating = false;
    }
}

function stopHold(){
    clearInterval(timer);
    holdBtn.classList.remove("holding");
    if(progress<100){
        progress=0;
        holdBtn.style.background = "linear-gradient(to right,#007bff 0%,#ffffff 0%)";
        holdBtn.textContent = "Press & Hold to Start Journey";
    }
}
</script>

</body>
</html>
