<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:min(450px, calc(100% - 32px));
            margin:clamp(24px, 8vh, 70px) auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        .form-group input,
        .form-group select{
            width:100%;
            min-height:42px;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        .form-group input:focus,
        .form-group select:focus{
            outline:none;
            border-color:#007bff;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#0056b3;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            color:#007bff;
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:520px){
            .container{padding:22px}
        }

    </style>

    <script src="language.js" defer></script>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form id="signupForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="form-group">
            <label>Country</label>

            <select name="country" required>
                <option value="">Select Country</option>
                <option value="India">India</option>
                <option value="United States">United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Australia">Australia</option>
                <option value="Canada">Canada</option>
                <option value="Germany">Germany</option>
                <option value="Japan">Japan</option>
            </select>

        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   minlength="8"
                   placeholder="Enter password"
                   pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#])[A-Za-z\d@$!%*?&^#]{8,}$"
                   title="Password must contain at least 8 characters, including one uppercase letter, one lowercase letter, one number, and one special character."
                   required>
        </div>

        <button type="submit">Sign Up</button>

    </form>

    <div class="login-link">
    <p id="signupMessage" role="status"></p>
        Already have an account?
        <a href="signup.html">Login</a>
    </div>

</div>

<script src="api.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const message = document.getElementById("signupMessage");
    const button = form.querySelector("button[type='submit']");
    button.disabled = true;
    message.textContent = "";
    try {
        const result = await EasyBook.request("/auth/signup", {
            method: "POST",
            body: JSON.stringify({ email: form.elements.email.value, country: form.elements.country.value, password: form.elements.password.value })
        });
        EasyBook.saveSession(result);
        location.href = "home.html";
    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
        button.disabled = false;
    }
});
</script>
</body>
</html>
