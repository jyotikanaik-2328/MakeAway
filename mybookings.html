<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeAway | My Bookings</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{min-height:100vh;background:#f8f4ff;color:#2b2240;padding:30px}
        .container{max-width:900px;margin:auto}
        h1{color:#4b2e83;margin:14px 0 10px;font-size:30px}
        .subtitle{color:#62507d;margin-bottom:25px}
        .back-btn{display:inline-block;margin-bottom:12px;background:#7c4dff;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:bold}
        .back-btn:hover,.view-btn:hover{background:#6730ff}
        .booking-card{background:#fff;border:1px solid #eadcff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 5px 15px rgba(124,77,255,.10)}
        .booking-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px;flex-wrap:wrap}
        .booking-id{font-weight:bold;color:#4b2e83;font-size:17px;overflow-wrap:anywhere}
        .status{background:#dcfce7;color:#16a34a;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold;text-transform:capitalize}
        .status.pending{background:#fff7d6;color:#956b00}
        .status.cancelled{background:#fee2e2;color:#b91c1c}
        .status.expired{background:#eee;color:#666}
        .booking-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
        .detail label{display:block;font-size:13px;color:#62507d;margin-bottom:4px}
        .detail span{font-weight:bold;overflow-wrap:anywhere}
        .view-btn{display:inline-block;margin-top:20px;background:#7c4dff;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:bold}
        .cancel-btn{margin:20px 0 0 10px;background:#b91c1c;border:0;color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
        .cancel-btn:hover{background:#991b1b}
        .no-bookings{background:#fff;border:1px solid #eadcff;border-radius:14px;padding:30px;text-align:center;color:#62507d}
        .no-bookings h2{color:#4b2e83;font-size:20px;margin-bottom:8px}
        .no-bookings a{color:#7c4dff;font-weight:bold}
        @media(max-width:600px){body{padding:16px}.booking-card{padding:16px}.booking-details{grid-template-columns:1fr 1fr}}
        @media(max-width:380px){.booking-details{grid-template-columns:1fr}}
    </style>
    <script src="language.js" defer></script>
</head>
<body>
<main class="container">
    <a href="home.html" class="back-btn">← Back to Home</a>
    <h1>My Bookings</h1>
    <p class="subtitle">View your bus booking history. Confirmed bookings can be cancelled before departure; a time-based charge is deducted from the refund.</p>
    <div id="bookingsContainer" aria-live="polite"></div>
</main>
<script src="api.js"></script>
<script>
const bookingsContainer = document.getElementById("bookingsContainer");

function showMessage(title, detail, linkText, href) {
    const panel = document.createElement("section");
    panel.className = "no-bookings";
    const heading = document.createElement("h2");
    heading.textContent = title;
    panel.appendChild(heading);
    if (detail) {
        const paragraph = document.createElement("p");
        paragraph.textContent = detail;
        panel.appendChild(paragraph);
    }
    if (linkText && href) {
        const link = document.createElement("a");
        link.href = href;
        link.textContent = linkText;
        panel.appendChild(link);
    }
    bookingsContainer.replaceChildren(panel);
}

function addDetail(grid, label, value) {
    const detail = document.createElement("div");
    detail.className = "detail";
    const name = document.createElement("label");
    name.textContent = label;
    const content = document.createElement("span");
    content.textContent = value || "-";
    detail.append(name, content);
    grid.appendChild(detail);
}

function formatDate(dateValue) {
    if (!dateValue) return "-";
    const date = new Date(`${dateValue}T00:00:00`);
    if (Number.isNaN(date.getTime())) return dateValue;
    return date.toLocaleDateString("en-IN", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function createBookingCard(booking) {
    const card = document.createElement("article");
    card.className = "booking-card";

    const header = document.createElement("div");
    header.className = "booking-header";
    const id = document.createElement("div");
    id.className = "booking-id";
    id.textContent = `Booking ID: ${booking.id}`;
    const status = document.createElement("span");
    const isExpired = booking.status === "expired";
    status.className = `status ${isExpired ? "cancelled" : booking.status}`;
    status.textContent = isExpired ? "Cancelled" : booking.status;
    header.append(id, status);

    const paymentLabel = booking.paymentMethod ? booking.paymentMethod.toUpperCase() : booking.status === "confirmed" ? "Not recorded" : "Payment pending";

    const details = document.createElement("div");
    details.className = "booking-details";
    addDetail(details, "Bus", booking.bus?.name);
    addDetail(details, "Route", `${booking.bus?.source || "-"} → ${booking.bus?.destination || "-"}`);
    addDetail(details, "Boarding Point", booking.boardingPoint);
    addDetail(details, "Drop Point", booking.dropPoint);
    addDetail(details, "Journey Date", formatDate(booking.journeyDate));
    addDetail(details, "Departure", booking.bus?.departure);
    addDetail(details, "Selected Seats", Array.isArray(booking.seats) ? booking.seats.join(", ") : "-");
    addDetail(details, "Total Fare", `₹${booking.total ?? 0}`);
    addDetail(details, "Payment", paymentLabel);
    if (booking.status === "cancelled") {
        addDetail(details, "Cancellation Charge", `₹${booking.cancellationFee ?? 0}`);
        addDetail(details, "Refund Amount", `₹${booking.refundAmount ?? 0}`);
    }

    card.append(header, details);
    if (booking.status === "confirmed") {
        const ticket = document.createElement("a");
        ticket.className = "view-btn";
        ticket.href = `ticket.html?booking_id=${encodeURIComponent(booking.id)}`;
        ticket.textContent = "View Ticket";
        card.appendChild(ticket);
    } else if (booking.status === "pending") {
        const payment = document.createElement("a");
        payment.className = "view-btn";
        payment.href = `payment.html?booking_id=${encodeURIComponent(booking.id)}`;
        payment.textContent = "Continue to Payment";
        card.appendChild(payment);
    }
    if (booking.status === "confirmed" || booking.status === "pending") {
        const cancel = document.createElement("button");
        cancel.className = "cancel-btn";
        cancel.type = "button";
        cancel.textContent = "Cancel Booking";
        cancel.addEventListener("click", () => cancelBooking(booking));
        card.appendChild(cancel);
    }
    return card;
}

async function cancelBooking(booking) {
    const warning = booking.status === "confirmed"
        ? "This booking will be cancelled. A time-based cancellation charge will be deducted from your refund. Continue?"
        : "Cancel this unpaid booking?";
    if (!window.confirm(warning)) return;
    try {
        const result = await EasyBook.request(`/bookings/${encodeURIComponent(booking.id)}`, { method: "DELETE" });
        window.alert(result.message);
        await loadBookings();
    } catch (error) {
        window.alert(error.message);
    }
}

async function loadBookings() {
    if (!localStorage.getItem("easybookToken")) {
        showMessage("Please log in", "Sign in to view your bookings.", "Login", "signup.html?next=mybookings.html");
        return;
    }
    showMessage("Loading bookings", "Please wait.");
    try {
        const result = await EasyBook.request("/bookings");
        const bookings = result.bookings || [];
        if (!bookings.length) {
            showMessage("No bookings found", "You have not made any bus bookings yet.", "Search buses", "home.html");
            return;
        }
        bookingsContainer.replaceChildren(...bookings.map(createBookingCard));
    } catch (error) {
        showMessage("Unable to load bookings", error.message, "Login", "signup.html?next=mybookings.html");
    }
}

loadBookings();
</script>
</body>
</html>
